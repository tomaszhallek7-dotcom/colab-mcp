name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Lint markdown
      uses: nosborn/github-action-markdown-cli@v3.3.0
      with:
        files: .
        config_file: '.markdownlint.json'
